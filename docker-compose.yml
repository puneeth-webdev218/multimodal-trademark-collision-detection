# Docker Compose for AI Trademark Collision Detection System
version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trademark-api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./models/embeddings.pkl:/app/models/embeddings.pkl:ro
      - ./similarity/faiss_index.bin:/app/similarity/faiss_index.bin:ro
      - ./similarity/index_metadata.pkl:/app/similarity/index_metadata.pkl:ro
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_NAME=resnet50
      - USE_GPU=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Service  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: trademark-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: trademark-network
